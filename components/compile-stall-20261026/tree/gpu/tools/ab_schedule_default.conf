# Nord2 Metal in-boot A/B schedule (shipped as Nord2Metal.bundle/ABSchedule.conf
# by tools/package_metal_addon.py --ab-schedule). Seconds since boot.
# Baseline first (boot, first frames, pipeline compiles), then each variant
# next to a baseline phase, cycling for the rest of the boot.
# TEGU_TILE_FETCH needs a frontend built with -DTEGU_TILE_FETCH_DEFAULT=0
# (tile fetch compiled in, off by default); NORD2_METAL_BATCH_MAX matters only
# with JM batching on (TEGU_JM_BATCH / -DTEGU_JM_BATCH_DEFAULT).
baseline 60
phase 45 TEGU_TILE_FETCH=1
phase 45
phase 45 NORD2_METAL_PREFRAME=1
phase 45
phase 45 NORD2_METAL_BATCH_MAX=128
phase 45
phase 45 TEGU_NATIVE_INDEXED=0
phase 45
phase 45 TEGU_ASYNC_PIPELINE=1
phase 45
repeat 1
