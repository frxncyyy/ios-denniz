[binaries]
c = ['clang', '-target', 'arm64-apple-ios16.0', '-isysroot', '$NORD2_WORK/gpu/build/apple-toolchain/sdks/iPhoneOS16.5.sdk']
cpp = ['clang++', '-target', 'arm64-apple-ios16.0', '-isysroot', '$NORD2_WORK/gpu/build/apple-toolchain/sdks/iPhoneOS16.5.sdk', '-stdlib=libc++', '-fuse-cxa-atexit']
objc = ['clang', '-target', 'arm64-apple-ios16.0', '-isysroot', '$NORD2_WORK/gpu/build/apple-toolchain/sdks/iPhoneOS16.5.sdk']
objcpp = ['clang++', '-target', 'arm64-apple-ios16.0', '-isysroot', '$NORD2_WORK/gpu/build/apple-toolchain/sdks/iPhoneOS16.5.sdk', '-stdlib=libc++']
c_ld = 'lld'
objc_ld = 'lld'
cpp_ld = 'lld'
objcpp_ld = 'lld'
ar = 'llvm-ar'
ranlib = 'llvm-ranlib'
strip = 'llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'darwin'
subsystem = 'ios'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

[properties]
needs_exe_wrapper = true
