# Proposal only; no .github workflow was modified or dispatched.
name: nord2-redwood-audio-private
on: workflow_dispatch
jobs:
  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned unmodified source
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          research/nord2/audio/playback-20261023/install-sol/build-plugin.sh research/nord2/audio/playback-20261023/upstream/topaz/userland/audio RedwoodAudio.driver
          python3 research/nord2/audio/playback-20261023/install-sol/package.py build RedwoodAudio.driver nord2-audio-package.bin
          python3 research/nord2/audio/playback-20261023/install-sol/package.py verify nord2-audio-package.bin
      - uses: actions/upload-artifact@v4
        with:
          name: nord2-redwood-audio-private
          path: |
            RedwoodAudio.driver
            nord2-audio-package.bin
          retention-days: 1
